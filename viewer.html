<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Preview</title>
    <style>
        :root {
            color-scheme: light;
            --qs-blue: #0d6da0;
            --qs-blue-hover: #095c8a;
            --qs-blue-soft: #e8f4fb;
            --qs-bg: #eef2f5;
            --qs-card: #ffffff;
            --qs-border: #dce3e8;
            --qs-border-strong: #c8d2da;
            --qs-text: #1f2933;
            --qs-muted: #667785;
            --qs-error: #c62828;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--qs-bg);
            color: var(--qs-text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button {
            font: inherit;
        }

        .viewer-shell {
            width: min(1480px, 100%);
            margin: 0 auto;
            padding: 14px 24px 44px;
        }

        .viewer-topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 54px;
            margin-bottom: 22px;
            padding: 8px 0 10px;
            border-bottom: 1px solid rgba(200, 210, 218, 0.9);
            background: rgba(238, 242, 245, 0.94);
            backdrop-filter: blur(12px);
        }

        .viewer-title-group {
            display: flex;
            align-items: baseline;
            min-width: 0;
            gap: 10px;
        }

        .viewer-title {
            flex: 0 0 auto;
            margin: 0;
            color: var(--qs-blue);
            font-size: 16px;
            font-weight: 750;
            letter-spacing: -0.01em;
        }

        .viewer-subtitle {
            min-width: 0;
            max-width: min(56vw, 720px);
            margin: 0;
            overflow: hidden;
            color: var(--qs-muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewer-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            gap: 7px;
            padding: 7px 12px;
            border: 1px solid var(--qs-blue);
            border-radius: 7px;
            background: var(--qs-blue);
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
        }

        .btn svg {
            display: block;
            flex: 0 0 auto;
        }

        .btn:hover {
            border-color: var(--qs-blue-hover);
            background: var(--qs-blue-hover);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible,
        .rotate-btn:focus-visible {
            outline: 3px solid rgba(13, 109, 160, 0.24);
            outline-offset: 2px;
        }

        .btn.secondary {
            border-color: #b8cfdd;
            background: #fff;
            color: var(--qs-blue);
        }

        .btn.secondary:hover {
            border-color: #9fc2d5;
            background: #f3f9fc;
        }

        .btn:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .status-card,
        .error-card {
            max-width: 720px;
            margin: 48px auto 0;
            padding: 22px;
            border: 1px solid var(--qs-border);
            border-radius: 10px;
            background: var(--qs-card);
            box-shadow: 0 6px 18px rgba(31, 41, 51, 0.08);
            text-align: center;
        }

        .error-card {
            color: var(--qs-error);
        }

        .warning-card {
            margin: 0 0 18px 154px;
            padding: 10px 14px;
            border: 1px solid #e6c46a;
            border-radius: 8px;
            background: #fff8df;
            color: #6b5315;
            font-size: 12px;
            font-weight: 650;
        }

        .labels-container {
            display: flex;
            flex-direction: column;
            gap: 42px;
        }

        .viewer-group {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr);
            align-items: start;
            column-gap: 22px;
        }

        .group-summary {
            position: sticky;
            top: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 0;
            padding-top: 9px;
        }

        .group-title {
            margin: 0;
            color: #40515e;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
        }

        .viewer-group-items {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 30px;
        }

        .label-card {
            display: grid;
            min-width: 0;
            grid-template-columns: minmax(0, 1fr) minmax(48px, max-content);
            align-items: start;
            column-gap: 12px;
        }

        .media-card {
            position: relative;
            display: flex;
            min-width: 0;
            justify-content: center;
            overflow: auto;
            border: 1px solid var(--qs-border);
            border-radius: 10px;
            background: var(--qs-card);
            box-shadow: 0 5px 16px rgba(31, 41, 51, 0.11);
        }

        .image-item .media-card {
            padding: 18px;
        }

        .pdf-item .media-card {
            display: block;
            overflow: hidden;
        }

        .media-shell {
            display: flex;
            width: 100%;
            min-width: 0;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        .img-container {
            display: flex;
            max-width: 100%;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: visible;
            box-sizing: content-box;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .pdf-container {
            width: 100%;
            max-width: none;
            flex: 1 1 auto;
            padding: 0;
        }

        .img-container img {
            display: block;
            max-width: 100%;
            height: auto;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        .pdf-frame {
            display: block;
            width: 100%;
            height: 84vh;
            min-height: 560px;
            border: 0;
            background: #fff;
        }

        .page-num {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            gap: 3px;
            padding-top: 9px;
            color: var(--qs-blue);
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .page-total {
            color: #5f7180;
            font-size: 12px;
            font-weight: 650;
        }

        .label-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .rotate-btn {
            display: inline-grid;
            width: 40px;
            height: 40px;
            place-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--qs-blue);
            cursor: pointer;
        }

        .rotate-btn:hover {
            background: #fff;
            color: var(--qs-blue-hover);
        }

        .rotate-btn:active {
            transform: rotate(0deg) scale(0.95);
        }

        .fan-icon {
            width: 22px;
            height: 22px;
            color: var(--qs-blue);
            opacity: 0;
            transition: opacity 0.5s, transform 0.3s ease;
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        @media (max-width: 780px) {
            .viewer-shell {
                padding: 10px 12px 30px;
            }

            .viewer-topbar {
                align-items: flex-start;
                flex-wrap: wrap;
                margin-bottom: 18px;
            }

            .viewer-title-group {
                width: 100%;
            }

            .viewer-subtitle {
                max-width: none;
            }

            .viewer-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .viewer-group {
                grid-template-columns: 1fr;
                row-gap: 12px;
            }

            .warning-card {
                margin-left: 0;
            }

            .group-summary {
                position: static;
                justify-content: flex-start;
                padding-top: 0;
            }

            .label-card {
                grid-template-columns: minmax(0, 1fr) minmax(46px, max-content);
                column-gap: 8px;
            }

            .pdf-frame {
                height: 74vh;
                min-height: 440px;
            }
        }

        @media (max-width: 480px) {
            .viewer-title-group {
                align-items: flex-start;
                flex-wrap: wrap;
                gap: 4px 8px;
            }

            .viewer-subtitle {
                order: 3;
                width: 100%;
            }

            .viewer-actions {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
            }

            .btn {
                padding-inline: 8px;
            }

            .image-item .media-card {
                padding: 8px;
            }

            .img-container {
                padding: 6px;
            }

            .label-actions {
                top: 7px;
                right: 7px;
            }

            .rotate-btn {
                width: 40px;
                height: 40px;
            }

            .pdf-frame {
                min-height: 380px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media print {
            @page {
                margin: 0;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                background: #fff;
            }

            .viewer-topbar,
            .group-summary,
            .page-num,
            .label-actions,
            .viewer-group.documents-group,
            .label-card.pdf-item,
            .status-card,
            .warning-card,
            .error-card {
                display: none !important;
            }

            .viewer-shell,
            .labels-container,
            .viewer-group,
            .viewer-group-items,
            .label-card,
            .media-card,
            .media-shell,
            .img-container {
                display: block;
                width: 100% !important;
                height: auto !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                gap: 0 !important;
                border: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                background: #fff !important;
                overflow: visible !important;
            }

            .label-card.image-item {
                break-inside: avoid;
                page-break-inside: avoid;
                break-after: page;
                page-break-after: always;
            }

            .label-card.image-item:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .img-container img {
                display: block;
                width: auto !important;
                height: auto !important;
                max-width: 100% !important;
                max-height: 100vh !important;
                margin: 0 auto !important;
                object-fit: contain;
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="viewer-shell">
        <header class="viewer-topbar">
            <div class="viewer-title-group">
                <h1 class="viewer-title">Document Preview</h1>
                <p id="viewer-subtitle" class="viewer-subtitle">Preparing documents…</p>
            </div>
            <div class="viewer-actions">
                <button id="download-btn" class="btn" type="button" hidden>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3v12" />
                        <path d="m7 10 5 5 5-5" />
                        <path d="M5 21h14" />
                    </svg>
                    <span id="download-btn-label">Download</span>
                </button>
                <button id="print-all-btn" class="btn secondary" type="button">Print</button>
                <button id="close-btn" class="btn secondary" type="button">Close</button>
            </div>
        </header>

        <section id="status" class="status-card" role="status">Loading preview…</section>
        <section id="viewer" class="labels-container" aria-label="Preview contents"></section>
    </main>

    <script src="viewer-utils.js"></script>
    <script src="viewer.js"></script>
</body>

</html>
